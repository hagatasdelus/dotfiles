onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
default_shell = ""
shell_mode = "auto"
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+q"
rename_workspace = "prefix+$"
new_workspace = "prefix+shift+w"
workspace_picker = "prefix+w"
detach = "prefix+q"
next_tab = "ctrl+tab"
previous_tab = "ctrl+shift+tab"
new_tab = "super+t"
close_tab = "super+w"
switch_tab = "super+1..9"

split_vertical = ["prefix+=", "prefix+|"]
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"

copy_mode = "prefix+["

goto = ["super+p", "ctrl+shift+p"]

resize_mode = "prefix+s"

navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "~/dev/ghq/github.com/hagatasdelus/dotfiles/scripts/darwin/karabiner-profile.sh"
description = "Toggle Karabiner profile (US/JIS)"

[[keys.command]]
key = "prefix+shift+c"
type = "popup"
command = "~/dev/ghq/github.com/hagatasdelus/dotfiles/scripts/darwin/caffeinate.sh"
description = "Caffeinate: prevent sleep"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "~/dev/ghq/github.com/hagatasdelus/dotfiles/scripts/darwin/bin/winmax maximize"
description = "Maximize front window"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = "~/dev/ghq/github.com/hagatasdelus/dotfiles/scripts/darwin/bin/winmax restore"
description = "Restore front window"

[[keys.command]]
key = "prefix+i"
type = "shell"
command = '''
AGENT_NAME=$(herdr pane get "$HERDR_ACTIVE_PANE_ID" | jq -r '.result.pane.agent // "shell"');
NEW_PANE=$(herdr pane split --direction down --ratio 0.75 --focus | jq -r '.result.pane.pane_id');
herdr pane rename "$NEW_PANE" "📝 Prompting for ${AGENT_NAME}(${HERDR_ACTIVE_PANE_ID})";
herdr pane run "$NEW_PANE" "NVIM_NOTTYFAST=1 editprompt open --editor nvim --target-pane $HERDR_ACTIVE_PANE_ID --mux herdr --quiet";
'''
description = "Open editprompt in a new pane"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''
PANE_LABEL=$(herdr pane get "$HERDR_ACTIVE_PANE_ID" | jq -r '.result.pane.label // ""');
if [[ "$PANE_LABEL" =~ Prompting\ for ]]; then
  TARGET=$(echo "$PANE_LABEL" | sed -E 's/.*\(([^)]+)\)/\1/');
else
  TARGET="$HERDR_ACTIVE_PANE_ID";
fi
SAFE_TARGET=$(echo "$TARGET" | tr ':' '-');
TMPFILE="${TMPDIR:-/tmp/}herdr-scrollback-${SAFE_TARGET}.txt";
herdr pane read "$TARGET" --source recent-unwrapped --lines 1000 > "$TMPFILE";
NEW_PANE=$(herdr pane split --pane "$TARGET" --direction down --ratio 0.90 --focus | jq -r '.result.pane.pane_id');
herdr pane zoom --pane "$NEW_PANE" --on;
herdr pane run "$NEW_PANE" "NVIM_NOTTYFAST=1 EDITPROMPT_TARGET_PANE='$TARGET' nvim '$TMPFILE'; herdr pane zoom --off; herdr pane close '$NEW_PANE'; herdr pane focus --pane '$HERDR_ACTIVE_PANE_ID'; rm -f '$TMPFILE'";
'''
description = "Edit scrollback in $EDITOR targeted for agent pane with auto-refocus"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = '''
PANE_LABEL=$(herdr pane get "$HERDR_ACTIVE_PANE_ID" | jq -r '.result.pane.label // ""');
if [[ "$PANE_LABEL" =~ Prompting\ for ]]; then
  TARGET=$(echo "$PANE_LABEL" | sed -E 's/.*\(([^)]+)\)/\1/');
else
  TARGET="$HERDR_ACTIVE_PANE_ID";
fi
TEXT=$(pbpaste);
if [ -n "$TEXT" ]; then
  editprompt collect --mux herdr --target-pane "$TARGET" -- "$TEXT";
fi
'''
description = "Collect clipboard text as quote for target editprompt pane"

[[keys.command]]
key = "prefix+f"
description = "Search Files"
type = "popup"
width = "95%"
height = "90%"
command = '''
SELECTED=$(rg --files --hidden --glob '!.git' | fzf --preview 'bat --style=numbers --color=always --line-range :500 {}')
if [ -n "$SELECTED" ]; then
  herdr pane send-text "$HERDR_ACTIVE_PANE_ID" "nvim $SELECTED"
  herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" "enter"
fi
'''

[[keys.command]]
key = "prefix+g"
description = "Live Grep"
type = "popup"
width = "95%"
height = "90%"
command = '''
SELECTED=$(fzf --bind 'change:reload:rg --line-number --no-heading --color=always --smart-case {q} || true' \
    --ansi --delimiter : \
    --preview 'bat --style=numbers --color=always --highlight-line {2} {1}' \
    --preview-window 'up,60%,border-bottom,+{2}+3/3,~3' \
  | awk -F: '{print "+"$2, $1}')
if [ -n "$SELECTED" ]; then
  herdr pane send-text "$HERDR_ACTIVE_PANE_ID" "nvim $SELECTED"
  herdr pane send-keys "$HERDR_ACTIVE_PANE_ID" "enter"
fi
'''

[[keys.command]]
key = "prefix+L"
description = "Open lazygit in popup"
type = "popup"
width = "95%"
height = "90%"
command = "lazygit --use-config-dir=$HOME/.config/lazygit"

[theme]
name = "kanagawa"
auto_switch = true
light_name = "kanagawa-lotus"
dark_name = "kanagawa"

[theme.custom]
panel_bg = "reset"
accent = "#CDFF04"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
mobile_width_threshold = 64
mouse_capture = true
confirm_close = true
prompt_new_tab_name = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
accent = "#CDFF04"

[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
kitty_graphics = true
pane_history = false
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_cursor_shape = "steady_block"

[advanced]
scrollback_limit_bytes = 10000000
